name: R package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("nnet", "nloptr"))'
      - name: Check package
        run: |
          R CMD build packages/ivmsm
          R CMD check --no-manual ivmsm_0.1.1.tar.gz
      - name: Public smoke tests
        run: Rscript --vanilla scripts/public/run_smoke_tests.R
      - name: Main results collection contract
        run: Rscript --vanilla tests/test_paper_collection.R
      - name: Code-only population target fixture
        run: Rscript --vanilla tests/test_code_only_targets.R
